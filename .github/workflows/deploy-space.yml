name: Deploy API to Hugging Face Space

# Runs after CI succeeds on main (or manually). Pushes only what the API image needs — the
# Dockerfile, backend/ (without tests), and the Space card — to the Space repository, which
# rebuilds the container. Skips cleanly until the Space is configured:
#   repository variable HF_SPACE_ID   e.g. baymax12op/algo-trade-api
#   repository secret   HF_SPACE_TOKEN  a Hugging Face token with write access to that Space
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$HF_SPACE_ID" ] || [ -z "$HF_SPACE_TOKEN" ]; then
            echo "HF_SPACE_ID variable or HF_SPACE_TOKEN secret not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble Space contents
        if: steps.config.outputs.ready == 'true'
        run: |
          mkdir space
          cp Dockerfile .dockerignore space/
          cp deploy/huggingface/README.md space/README.md
          rsync -a --exclude 'tests/' --exclude '__pycache__/' --exclude '*.pyc' --exclude '.env' --exclude 'venv/' --exclude '.venv/' backend/ space/backend/
          echo "Deployed from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" > space/DEPLOYED_FROM
          find space -type f | sort | head -100
      - name: Push to the Space
        if: steps.config.outputs.ready == 'true'
        working-directory: space
        run: |
          git init -q -b main
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_SPACE_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main 2>&1 | sed "s/${HF_SPACE_TOKEN}/***/g"
          echo "Space: https://huggingface.co/spaces/${HF_SPACE_ID}"
