server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser talks to /api, nginx forwards to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        # Server-Sent Events (copilot streaming): no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths fall back to index.html (deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
